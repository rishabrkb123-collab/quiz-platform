services:
  postgres:
    image: postgres:16-alpine
    container_name: quiz-platform-terminal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quiz_platform_terminal
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password
    ports:
      - "5433:5432"
    volumes:
      - quiz_platform_terminal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz_user -d quiz_platform_terminal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quiz_platform_terminal_data:
